[project]
name = "ai-hub"
version = "0.1.0"
description = "Unified AI/ML Hub with CLI, API, and ML components"
authors = [{name = "NeuralBlitz"}]
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "click>=8.5.1",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "streamlit>=1.28.0",
    "requests>=2.28.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "networkx>=3.0",
    "PyJWT>=2.8.0",
    "plotly>=5.0.0",
    "scipy>=1.11.0",
    "psutil>=5.9.0",
    "ipywidgets>=8.0.0",
]

[project.scripts]
ai-hub = "ai_hub.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ai_hub", "acca"]

[tool.setuptools.package-dir]
ai_hub = "src/ai_hub"
acca = "projects/acca/src/acca"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.24.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"

# Preserve CPU-only PyTorch wheels on Linux in reproducible uv resolutions.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
