# Minimal, intentionally bounded development deployment.
# Legacy docker-compose.yml contains additional services not yet release-validated.
name: ainglys-core

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    command: ["uvicorn", "ai_hub.api:app", "--host", "0.0.0.0", "--port", "8000"]
    init: true
    restart: unless-stopped
    environment:
      AI_HUB_API_KEY: ${AI_HUB_API_KEY:?Define a strong AI_HUB_API_KEY of at least 32 characters}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - model_data:/app/models
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  ui:
    profiles: ["ui"]
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    command: ["streamlit", "run", "src/ai_hub/web.py", "--server.address", "0.0.0.0", "--server.port", "8501"]
    init: true
    restart: unless-stopped
    environment:
      AI_HUB_API_KEY: ${AI_HUB_API_KEY:?Define a strong AI_HUB_API_KEY of at least 32 characters}
      AI_HUB_API_URL: http://api:8000
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  model_data:
