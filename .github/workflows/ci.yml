name: Ainglys CI

on:
  push:
    branches: [main, 'fix/**', 'feature/**']
  pull_request:

permissions:
  contents: read

jobs:
  core-tests:
    name: Core smoke tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install the full root package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip check
      - name: Check imports and Python syntax
        run: |
          python -m compileall -q src projects/acca/src tests
          python -c 'import ai_hub, acca; from ai_hub.api import app; print(app.title)'
      - name: Run core security and integration smoke tests
        env:
          AI_HUB_API_KEY: test-only-api-key-at-least-32-characters-long
          JWT_SECRET_KEY: test-only-jwt-secret-at-least-32-characters-long
        run: |
          python -m pytest -q tests/test_api.py tests/test_ml_engine.py projects/acca/tests/test_core.py
